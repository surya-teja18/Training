
<!DOCTYPE html><html><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container py-5"><div class="card shadow p-4">
<h2>Event Registration</h2>
<form onsubmit="document.getElementById('msg').style.display='block';return false;">
<input class="form-control mb-3" placeholder="Student Name" required>
<input class="form-control mb-3" placeholder="Roll Number" required>
<input class="form-control mb-3" placeholder="Branch" required>
<input class="form-control mb-3" type="email" placeholder="Email" required>
<input class="form-control mb-3" placeholder="Mobile Number" required>
<select class="form-select mb-3"><option>Hackathon</option><option>Coding Contest</option></select>
<button class="btn btn-success">Submit</button></form>
<div id="msg" style="display:none" class="alert alert-success mt-3">Registration Successful!</div>
</div></div></body></html>
