<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Management</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --accent: #0f0e0e;
            --muted: #6b7280;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: var(--bg) url('download.jpg') center/cover no-repeat;
            background-attachment: fixed;
            color: var(--accent);
        }

        .site-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0;
        }

        .header-stats {
            background: var(--primary);
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            font-weight: 600;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.9);
        }

        nav a {
            background: var(--card);
            color: var(--accent);
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
            border: 1px solid rgba(15, 14, 14, 0.04);
            transition: all 0.3s ease;
        }

        nav a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 24, 40, 0.08);
            background: var(--primary);
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 24px auto;
            padding: 24px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(2, 6, 23, 0.06);
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 24px;
            text-align: center;
        }

        .search-bar {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-bar button {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .search-bar button:hover {
            background: #2563eb;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
        }

        .students-table thead {
            background: linear-gradient(180deg, #f3f4f6, #e5e7eb);
        }

        .students-table th {
            padding: 14px;
            text-align: left;
            font-weight: 700;
            color: var(--accent);
            border-bottom: 2px solid #d1d5db;
        }

        .students-table tbody tr {
            border-bottom: 1px solid #e5e7eb;
            transition: background-color 0.2s ease;
        }

        .students-table tbody tr:hover {
            background-color: #f9fafb;
        }

        .students-table td {
            padding: 14px;
        }

        .student-name {
            font-weight: 600;
            color: var(--primary);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: var(--primary);
            color: white;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            display: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: var(--card);
            margin: 5% auto;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .close {
            color: var(--muted);
            float: right;
            font-size: 28px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .site-header {
                flex-direction: column;
                gap: 12px;
            }

            .students-table {
                font-size: 0.9rem;
            }

            .students-table th,
            .students-table td {
                padding: 10px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <h2 class="header-title">Student Management System</h2>
        <div class="header-stats">Total Students: <span id="totalStudents">0</span></div>
    </header>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="add_student.html">Add Student</a>
        <a href="view_student.html"> View Students</a>
        <a href="logout.html"> Logout</a>
    </nav>

    <div class="container">
        <h1>Student Dashboard</h1>

        <div id="successAlert" class="alert alert-success"></div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name or email...">
            <button onclick="searchStudents()">Search</button>
            <button onclick="resetSearch()" style="background: var(--muted);">Reset</button>
        </div>

        <table class="students-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Batch</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsTableBody">
            </tbody>
        </table>

        <div id="emptyState" class="empty-state">
            <div></div>
            <p>No students found. <a href="add_student.html" style="color: var(--primary); text-decoration: underline;">Add a new student</a></p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <div class="modal-header">Edit Student</div>
            <form id="editForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="editPhone" required>
                </div>
                <div class="form-group">
                    <label>Course</label>
                    <select id="editCourse" required>
                        <option value="">Select Course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Civil">Civil</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Batch</label>
                    <input type="text" id="editBatch" placeholder="e.g., 2024" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-edit" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-edit" style="background: var(--success);">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentEditId = null;

        function loadStudents() {
            console.log('Loading students for dashboard');
            fetch("http://localhost:3001/students")
                .then(response => {
                    if (!response.ok) throw new Error('Error loading');
                    return response.json();
                })
                .then(students => {
                    console.log('Students:', students);
                    renderStudents(students);
                    updateTotalCount(students.length);
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('emptyState').style.display = 'block';
                });
        }

        function renderStudents(students) {
            let tableBody = document.getElementById('studentsTableBody');
            let emptyState = document.getElementById('emptyState');

            if (students.length === 0) {
                tableBody.innerHTML = '';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                let html = '';
                for (let i = 0; i < students.length; i++) {
                    let student = students[i];
                    html += '<tr>';
                    html += '<td>' + student.id + '</td>';
                    html += '<td><div class="student-name">' + student.name + '</div></td>';
                    html += '<td>' + student.email + '</td>';
                    html += '<td>' + student.phone + '</td>';
                    html += '<td>' + student.course + '</td>';
                    html += '<td>' + student.batch + '</td>';
                    html += '<td>';
                    html += '<div class="action-buttons">';
                    html += '<button class="btn btn-edit" onclick="openEditModal(\'' + student.id + '\')">Edit</button>';
                    html += '<button class="btn btn-delete" onclick="deleteStudent(\'' + student.id + '\')">Delete</button>';
                    html += '</div>';
                    html += '</td>';
                    html += '</tr>';
                }
                tableBody.innerHTML = html;
            }
        }

        function updateTotalCount(count) {
            document.getElementById('totalStudents').textContent = count;
        }

        function openEditModal(id) {
            console.log('Opening edit modal for:', id);
            fetch("http://localhost:3001/students/" + id)
                .then(response => response.json())
                .then(student => {
                    currentEditId = student.id;
                    document.getElementById('editName').value = student.name;
                    document.getElementById('editEmail').value = student.email;
                    document.getElementById('editPhone').value = student.phone;
                    document.getElementById('editCourse').value = student.course;
                    document.getElementById('editBatch').value = student.batch;
                    document.getElementById('editModal').style.display = 'block';
                })
                .catch(error => console.error(error));
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditId = null;
        }

        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            console.log('Submitting edit:', currentEditId);
            if (currentEditId !== null) {
                let updatedData = {
                    id: currentEditId,
                    name: document.getElementById('editName').value,
                    email: document.getElementById('editEmail').value,
                    phone: document.getElementById('editPhone').value,
                    course: document.getElementById('editCourse').value,
                    batch: document.getElementById('editBatch').value
                };
                fetch("http://localhost:3001/students/" + currentEditId, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(updatedData)
                })
                .then(response => {
                    if (!response.ok) throw new Error('Update failed');
                    return response.json();
                })
                .then(data => {
                    console.log('Update successful');
                    closeEditModal();
                    loadStudents();
                    showAlert('Student updated successfully!');
                })
                .catch(error => {
                    console.error(error);
                    showAlert('Error updating student!');
                });
            }
        });

        function deleteStudent(id) {
            console.log('Deleting:', id);
            if (confirm('Are you sure you want to delete this student?')) {
                fetch("http://localhost:3001/students/" + id, {
                    method: "DELETE"
                })
                .then(response => {
                    if (!response.ok) throw new Error('Delete failed');
                    return response;
                })
                .then(() => {
                    console.log('Delete successful');
                    loadStudents();
                    showAlert('Student deleted successfully!');
                })
                .catch(error => {
                    console.error(error);
                    showAlert('Error deleting student!');
                });
            }
        }

        function searchStudents() {
            let query = document.getElementById('searchInput').value.trim();
            console.log('Searching for:', query);
            fetch("http://localhost:3001/students")
                .then(response => response.json())
                .then(students => {
                    if (query === '') {
                        renderStudents(students);
                    } else {
                        let filtered = students.filter(s => 
                            s.name.toLowerCase().includes(query.toLowerCase()) || 
                            s.email.toLowerCase().includes(query.toLowerCase())
                        );
                        renderStudents(filtered);
                    }
                })
                .catch(error => console.error(error));
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            loadStudents();
        }

        function showAlert(message) {
            let alert = document.getElementById('successAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(function() {
                alert.style.display = 'none';
            }, 3000);
        }

        window.onclick = function(event) {
            let modal = document.getElementById('editModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadStudents();
        });
    </script>
</body>

</html>

</html>
