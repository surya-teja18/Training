<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --accent: #0f0e0e;
            --muted: #6b7280;
            --primary: #3b82f6;
            --success: #10b981;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
            color: var(--accent);
            background: var(--bg) url('download.jpg') center/cover no-repeat;
            background-attachment: fixed;
        }

        .site-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.9);
        }

        nav a {
            background: var(--card);
            color: var(--accent);
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
            border: 1px solid rgba(15, 14, 14, 0.04);
            transition: all 0.3s ease;
        }

        nav a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 24, 40, 0.08);
            background: var(--primary);
            color: white;
        }

        .container {
            max-width: 600px;
            margin: 24px auto;
            padding: 24px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(2, 6, 23, 0.06);
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 24px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            color: var(--accent);
        }

        input[type=text],
        input[type=email],
        input[type=password],
        input[type=number],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: var(--card);
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type=text]:focus,
        input[type=email]:focus,
        input[type=password]:focus,
        input[type=number]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .col {
            flex: 1;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        button,
        input[type=submit] {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-submit {
            background: var(--success);
            color: white;
            flex: 1;
        }

        .btn-submit:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-reset {
            background: var(--muted);
            color: white;
            flex: 1;
        }

        .btn-reset:hover {
            background: #4b5563;
            transform: translateY(-2px);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        @media (max-width: 600px) {
            .container {
                margin: 12px;
                padding: 16px;
            }

            nav {
                gap: 8px;
            }

            h1 {
                font-size: 1.3rem;
            }

            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <nav>
            <a href="dashboard.html"> Dashboard</a>
            <a href="add_student.html"> Add Student</a>
            <a href="view_student.html"> View Students</a>
            <a href="logout.html"> Logout</a>
        </nav>
    </header>

    <div class="container">
        <h1>Add New Student</h1>

        <div id="successAlert" class="alert alert-success"></div>
        <div id="dangerAlert" class="alert alert-danger"></div>

        <form id="addStudentForm">
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required placeholder="Enter student name">
            </div>

            <div class="form-row">
                <div class="col form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="Enter email">
                </div>
                <div class="col form-group">
                    <label for="phone">Phone *</label>
                    <input type="text" id="phone" name="phone" required placeholder="Enter phone number">
                </div>
            </div>

            <div class="form-row">
                <div class="col form-group">
                    <label for="course">Course *</label>
                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Civil">Civil</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label for="batch">Batch *</label>
                    <input type="text" id="batch" name="batch" required placeholder="e.g., 2024">
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">Add Student</button>
                <button type="reset" class="btn-reset">Clear Form</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('addStudentForm').addEventListener('submit', function (e) {
            e.preventDefault();
            let name = document.getElementById('name').value;
            let email = document.getElementById('email').value;
            let phone = document.getElementById('phone').value;
            let course = document.getElementById('course').value;
            let batch = document.getElementById('batch').value;
            if (!name || !email || !phone || !course || !batch) {
                showAlert('Please fill all fields!', 'danger');
                return;
            }
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('Please enter a valid email address!', 'danger');
                return;
            }
            let studentData = {
                name: name,
                email: email,
                phone: phone,
                course: course,
                batch: batch
            };
            console.log('Sending student data:', studentData);
            fetch("http://localhost:3001/students", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(studentData)
            })
                .then(response => {
                    console.log('Response status:', response.status);
                    if (!response.ok) throw new Error('Server error: ' + response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('Success:', data);
                    showAlert('Student added successfully! Redirecting...', 'success');
                    document.getElementById('addStudentForm').reset();
                    setTimeout(function () {
                        window.location.href = 'view_student.html';
                    }, 2000);
                })
                .catch(error => {
                    console.error('Full error:', error);
                    showAlert('Error: ' + error.message + ' - Check if json-server is running on port 3001', 'danger');
                });
        });
        function showAlert(message, type) {
            let successAlert = document.getElementById('successAlert');
            let dangerAlert = document.getElementById('dangerAlert');
            if (type === 'success') {
                successAlert.textContent = message;
                successAlert.style.display = 'block';
            } else {
                dangerAlert.textContent = message;
                dangerAlert.style.display = 'block';
            }
            setTimeout(function () {
                successAlert.style.display = 'none';
                dangerAlert.style.display = 'none';
            }, 4000);
        }
    </script>
</body>

</html>
