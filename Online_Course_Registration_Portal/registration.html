<!DOCTYPE html><html><head><title>Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-light">
<div class="container py-5">
<h1 class="mb-4">Student Registration</h1>
<form onsubmit="event.preventDefault();document.getElementById('ok').classList.remove('d-none');">
<div class="row g-3">
<div class="col-md-6"><input class="form-control" placeholder="Student Name"></div>
<div class="col-md-6"><input class="form-control" placeholder="Email"></div>
<div class="col-md-6"><input class="form-control" placeholder="Mobile Number"></div>
<div class="col-md-6">
<select class="form-select"><option>Gender</option><option>Male</option><option>Female</option></select>
</div>
<div class="col-md-6"><select class="form-select"><option>Course Selection</option></select></div>
<div class="col-md-6"><input class="form-control" placeholder="Qualification"></div>
<div class="col-12"><textarea class="form-control" placeholder="Address"></textarea></div>
<div class="col-12"><input type="file" class="form-control"></div>
<div class="col-12 form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">Terms & Conditions</label></div>
<div class="col-12"><button class="btn btn-primary">Submit</button></div>
</div>
</form>
<div id="ok" class="alert alert-success mt-3 d-none">Registration Successful!</div>
</div></body></html>
